[workspace]
members = [
    "crates/prism_core",
    "crates/prism_hvs",
    "crates/prism_sync",
    "crates/prism_render",
    "crates/prism_cv",
    "crates/prism_cli",
    "crates/prism_wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
image = "0.25"
imageproc = "0.25"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
